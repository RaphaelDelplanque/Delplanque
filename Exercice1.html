    <br><br><br><br>

    <form>

            <textarea id="compteur" class="compteur" cols="10" rows="10" title="valeur du compteur">10</textarea>
        </div>
        <input type="button" onclick="augmenterLeCompteur()" value="faire '+1'"/>
